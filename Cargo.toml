[package]
name = "dog4"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Henrique Colini <henriquecolini@gmail.com>"]
description = "An esoteric, block-folding, Bash-flavoured scripting language built to be embedded and sandboxed."
license-file = "LICENSE"
readme = "README.md"

[features]
default = ["cli", "net"]
# The `dog4` command-line interpreter.
cli = ["dep:clap"]
# The `get` / `post` HTTP builtins.
net = ["dep:minreq"]

[dependencies]
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
rand = { version = "0.8", features = ["small_rng"] }
rustc-hash = "2"
clap = { version = "4", features = ["derive"], optional = true }
minreq = { version = "2", features = ["https"], optional = true }

[dev-dependencies]
proptest = "1"
libtest-mimic = "0.8"
criterion = { version = "0.5", default-features = false }

[[bin]]
name = "dog4"
required-features = ["cli"]

[[test]]
name = "scripts"
harness = false

[[bench]]
name = "vm"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true

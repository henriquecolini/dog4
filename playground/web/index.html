<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>dog4 Playground</title>
  <meta name="description" content="Write and run dog4, an esoteric Bash-flavoured language, in your browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,MONO@-15..0,300..800,0..1,0..1&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f4fd8'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' text-anchor='middle' fill='white'%3E%7B%7D%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <header class="bar">
      <a class="wordmark" href="./" aria-label="dog4 playground home">dog<span>4</span></a>
      <div class="controls">
        <label class="select">
          <span class="sr-only">Example</span>
          <select id="examples" aria-label="Load an example"></select>
        </label>
        <button id="run" class="primary" type="button" title="Run (Ctrl+Enter)">Run<kbd>⌘↵</kbd></button>
        <button id="stop" type="button" hidden>Stop</button>
        <button id="bytecode" type="button" aria-pressed="false" title="Show the compiled bytecode instead of running">Bytecode</button>
        <button id="share" type="button" title="Copy a link to this code">Share</button>
      </div>
      <nav class="links">
        <a href="https://github.com/henriquecolini/dog4#readme">Tutorial</a>
        <a href="https://github.com/henriquecolini/dog4/blob/main/docs/language.md">Reference</a>
        <a href="https://github.com/henriquecolini/dog4">Source</a>
      </nav>
    </header>

    <main class="panes">
      <section class="pane editor-pane" aria-label="Code">
        <div class="pane-head"><span>Code</span><span id="cursor" class="muted"></span></div>
        <div class="editor" id="editor">
          <div class="gutter" id="gutter" aria-hidden="true"></div>
          <div class="surface">
            <pre class="paint" id="paint" aria-hidden="true"><code id="painted"></code></pre>
            <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="dog4 code"></textarea>
          </div>
        </div>
      </section>

      <section class="pane output-pane" aria-label="Output">
        <div class="pane-head"><span id="output-title">Output</span><span id="status" class="muted" role="status">Loading dog4…</span></div>
        <pre class="output" id="output" tabindex="0"></pre>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
